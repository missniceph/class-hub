<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Hub</title>
  <meta name="description" content="Announcements, schedules, readings and deadlines for PA 106 and PA 152 at UP NCPAG.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#7b1113">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./">Class Hub <span>UP NCPAG</span></a>
      <button id="theme-toggle" class="theme-btn" type="button">Theme: Auto</button>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="intro">
      <h1>Your classes</h1>
      <p>Announcements, schedules, readings and deadlines in one place. Pick a class to see everything for it.</p>
    </section>
    <div id="cards" class="cards"></div>
    <noscript>
      <div class="card">
        <p>This site needs JavaScript to display nicely. You can still read the class files directly:
          <a href="content/pa106.md">PA 106</a> · <a href="content/pa152.md">PA 152</a></p>
      </div>
    </noscript>
  </main>

  <footer class="footer wrap">
    <p>University of the Philippines National College of Public Administration and Governance</p>
    <p>No logins, no tracking. Times are Philippine time.</p>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
